[project]
name = "ocean-agent-mcpb"
version = "0.4.60"
requires-python = ">=3.10"

# uv 타입이라 클로드가 이 선언을 보고 파이썬과 의존성을 알아서 설치한다.
# 사용자는 파이썬을 깔 필요가 없다. 여기서 PyPI 의 ocean-agent 를 받아오므로
# 배포 전에 PyPI 에 해당 버전이 올라가 있어야 한다.
# Keep this pin, manifest.json, install.ps1 and install.sh on the same
# version. It was left at 0.3.2 through 34 releases while manifest.json said
# otherwise, so an MCPB install reported a version it was not running.
dependencies = [
    "ocean-agent==0.4.60",
]
