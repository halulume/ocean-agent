# 자율 거래 개체 정책 (Autonomous Trading Policy)
# 이 파일이 "위임장"입니다. 개체는 이 울타리 안에서만 스스로 판단·거래합니다.
# 값을 바꾸면 개체의 행동 경계가 바뀝니다. 넓힐 때는 신중히.

# ── 네트워크 / 자금 ──
base_url: https://api.pacifica.fi   # 테스트넷은 명시할 때만: https://test-api.pacifica.fi
capital_usd: live                         # live = 지갑 실잔고(USDC) 연동 사이징(권장).
                                          # 고정하려면 숫자로(예: 1000). 방어선은 '시작 잔고' 기준.

# ── 운용 모드 ──
# aggressive: 테스트넷 학습용, 많이 거래해서 진입~청산 데이터를 폭발적으로 쌓음
# careful:    메인넷 실전용, 검증된 강한 셋업만, 안 잃는 게 최우선
# 메인넷 전환 시 이 값을 careful로만 바꾸면 아래 값들이 자동으로 보수화됨(주석 참고)
mode: careful     # 배포 기본값은 보수 모드. 테스트넷 학습용은 aggressive

# ── 허용 전략 (검증된 것만) ──
# funding_carry: 펀딩 캐리 (방향중립에 가까움, 저위험)
# stat_setup:    통계 관문 통과 셋업 (지표 신호, 중위험)
allowed_strategies:
  - funding_carry
  - stat_setup

# 통계 셋업 최소 요건 (이 미만이면 개체가 무시)
# 실효값은 MODE_PRESETS 가 우선한다
min_win_rate: 0.45
min_samples: 30             # 표본 30회 이상
# The edge gate (+2%p over baseline) is a measured constant fixed in code
# (signal_scanner.MIN_EDGE). It is not a policy key.
require_live_signal: true   # 점등 신호 우선. 단 아래 watchlist 예외 적용
# 진입 후보 스캔 범위 (거래대금 상위 N개). 100 = 상장 전체.
scan_universe: 100

# 감시목록 진입 예외: 지금 점등 안 됐어도 승률이 이 이상이면 진입 허용
# (SOL 86% 같은 강한 기회를 '점등 안 됨' 때문에 놓치지 않기 위함)
watchlist_entry_win_rate: 0.70   # 0으로 두면 예외 없음(점등만)

# ── 포지션 리스크 ──
risk_per_trade_pct: 0.02    # 1회 손절 시 자본의 2%만 잃도록 사이징
max_leverage: 10            # 레버리지 상한 (정책이 시장 최대치보다 우선)
max_concurrent: 3           # 동시 보유 포지션 수
max_position_usd: 3000      # 한 포지션 최대 명목가치
# 네이티브 TP/SL은 모든 진입에 항상 붙는다, 정책 키가 아니라 코드 고정
# 안전 불변식이다 (끌 수 없음).

# ── 방향 쏠림 한도 (넷 델타) ──
# 롱-숏 합산 노출이 자본의 이 비율을 넘으면 같은 방향 신규 진입 금지
# (숏 3개 몰림 → 급등 한 방에 다 맞는 사태 방지)
max_net_exposure_pct: 0.3

# ── 자가 재측정 (진짜 자기개선 엔진) ──
# 주기적으로 '전 코인 × 전 시간봉 × 전 신호' 매트릭스를 다시 측정해서
# 최적 시간봉과 유효 신호를 스스로 갱신한다. 백그라운드 실행.
# 08-21 에 15m·30m 의 60일 제한을 풀면서 약 20분에서 늘었다. 실측으로
# 캐시가 있으면 약 1.2시간, 새 컴퓨터면 다운로드까지 약 2시간이다.
# 근거: 국면은 바뀌고 고정 파라미터는 낡는다. 재측정이 낡음을 잡는다.
# 수동 실행: python -m ocean_agent.rematrix / 결과 확인: --show
rematrix_every_days: 7      # 7일마다 재측정 (0이면 끔)
walkforward_every_days: 14  # 14일마다 워크포워드 보정표 갱신 (0이면 끔)
# 보정표가 재는 시간봉. 봇이 실제 쓰는 시간봉이 실측표에 없으면 승률이
# 51~52%로 뭉개져 관문 경계에 걸린다, 전 시간봉을 잰다.
# 5m 은 뺐다 (사용자 지시 2026-08-12·08-13). rematrix.TFS 에 없으므로
# best_horizons 가 5분봉을 고를 일이 없는데, 여기 남아 있으면 워크포워드가
# 종목마다 수십만 봉을 새로 받고 그 결과는 쓰이지 않는다.
walkforward_tfs: [15m, 30m, 1h, 2h, 4h, 8h, 12h, 1d]

# ── 유동성 필터 (변동성이 아니라 '얇은 호가창'이 진짜 위험) ──
# 실측 교훈: HYPE에 $3,000 주문 → $13만 체결. 호가가 얇으면 손절이 걸려도
# 그 가격에 못 팔아 계획보다 크게 잃는다.
# 기준은 '거래대금이 큰가'가 아니라 '내 주문이 그 시장에 비해 큰가'다.
# 실측($3,000 주문): 거래대금의 0.3%(BTC)·4.6%(SOL)는 정상 체결,
#                    12.8%(HYPE)는 $13만 체결, 108%(PUMP)는 부분 체결.
# 이 기준은 네트워크 무관하게 작동, 메인넷 HYPE는 0.11%라 정상 통과하므로
# 주식·금·원자재 등 소형 마켓도 메인넷에선 살아남는다.
max_position_pct_of_volume: 0      # 2026-08-07 거래량·유동성 조건 제거 (0=끔)
min_volume_24h: 0                  # 절대 금액 하한(선택). 보통 0으로 둠

# ── 시간 만료 청산 ──
# 신호의 예측 지평(24캔들)이 끝나면 통계적 우위도 끝난다. 손절·익절 어느 쪽도
# 안 닿았으면 정리하고 그 자본으로 다음 기회를 잡는다. 자본 회전율 ↑
expire_after_horizons: 1.5  # 지평의 1.5배 시간 경과 시 청산 (0이면 끔)

# ── 포지션 사후관리 (이기는 거래 지키기) ──
partial_tp_at_pct: 0.015    # 수익 +1.5%에 부분 익절 (아래 비율만큼)
partial_tp_fraction: 0.5    # 부분 익절 비율 (0이면 부분 익절 안 함)
breakeven_at_pct: 0.01      # 수익 +1%에 손절선을 진입가로 (본전 보장)
trail_at_pct: 0.02          # 수익 +2%부터 트레일링 시작
trail_gap_pct: 0.01         # 트레일링 간격 (가격에서 1% 뒤따름)
# 손절선은 유리한 방향으로만 이동, 절대 후퇴하지 않음

# ── 두뇌(Brain) 종합 확신도 ──
# 매트릭스·관측DB·실전손익·원인분석·메타학습을 셋업 하나당 숫자 하나로 종합.
# 이 값이 진입 순서와 사이즈 배율(0.7~1.3)을 결정한다 = 모든 학습이 연결됨.
# 메타학습: 예측승률 vs 실제 격차를 축적, 표본 40건부터 자동 보정 발동.
min_conviction: 0.52        # 종합 확신도 이 미만이면 진입 안 함

# ── EV 비례 사이징 (강한 기회에 더 크게) ──
# 측정된 기대값(EV)이 높은 셋업에 포지션을 더 크게, 낮으면 작게.
# 실측: 통과 셋업 EV가 0%~16.7%로 편차 큼 → 같은 리스크는 낭비.
# ev_size_floor에서 배율 0.5, ev_size_cap에서 1.5까지 선형.
ev_size_floor_pct: 0.0      # 이 EV면 기본 사이즈의 0.5배
ev_size_cap_pct: 0.05       # 이 EV 이상이면 1.5배 (상한)

# ── 자가진단·적응 (멈추지 않고 스스로 개선) ──
# 개체는 청산된 거래를 채점해서 지는 신호를 스스로 정지시키고, 연패 시 사이즈를
# 줄이며, 회복하면 되돌린다. 24시간 계속 돌면서 승률을 스스로 끌어올린다.
adapt_min_graded: 8         # (구) 신호별 판단 시작 표본
adapt_min_graded_combo: 5   # 신호@시간봉 조합 단위 판단 시작 표본
                            # (조합으로 쪼개 표본이 얇으므로 낮춤. 정지엔 손익도 함께 확인)
adapt_win_floor: 0.45       # 실제 승률이 이 미만이면 그 신호 자동 정지
                            # (승률이 floor+10%p 회복하면 자동 재개)

# ── 방어선 (2단계) ── ※ 아래 두 값은 구 EV 봇(autonomous) 전용이다.
# 자동매매(브래킷 봇)는 이 두 키를 읽지 않는다. 브래킷의 보호는 포지션마다
# 거래소에 걸리는 손절이고, 계좌 단위 일일 한도는 없다. 계좌 단위로 줄이려면
# bracket_capital_pct 를 낮춰라.
# 소프트: 당일 -8% → 그날 신규 진입만 중단, 보유는 계속 관리 (나쁜 날 끊기)
# 최후:   시작자본 -20% → 전량 청산 + 완전 정지 (수동 재개)
soft_halt_pct: 0.08         # 당일 -8% 도달 시 그날 신규 진입 중단
fatal_loss_pct: 0.20        # 시작자본 대비 -20% 도달 시 전량 청산 + 완전 정지

# ── 포트폴리오 배분 (최종목표: 지갑 자본 증식) ──
# 자본을 버킷으로 나눠 운용, 매매(주력·수익엔진), 펀딩캐리(안정·이자),
# 나머지는 현금 예비(추가증거금·기회 대비). 사이클마다 버킷별 사용량을 재고
# 비는 버킷을 채우는 식으로 리밸런싱한다.
trading_alloc: 0.5          # 지표 매매(주력)에 자본의 50%까지
funding_alloc: 0.3          # 펀딩 캐리에 자본의 30%까지 (나머지 20%는 현금 예비)

# ── 펀딩 캐리 전략 파라미터 ──
funding_min_apr: 0.15       # 펀딩 연 15% 이상일 때만 캐리 진입
taker_fee: 0.0004           # 헤지 수량 보정용

# ── 국면 필터 (뉴스/공포지수) ──
# A/B 실측으로 기본 끔: 주력 신호 특성상 극단 공포에서 롱을 막으면
# 좋은 진입까지 버리게 된다.
# true 로 바꾸면 극단 공포/탐욕(FGI≤25/≥75)에서 신규 롱을 차단한다.
use_regime_filter: false

# ── 데이터 수집·학습 ──
# 진입 여부와 무관하게 켜진 신호를 전부 관측·채점해서
# 신호별 '실전 승률 DB'를 24시간 자동 축적한다 (적응 엔진이 참조).
collect_observations: true
observe_universe: 0         # 0 = 파시피카 전체 perp(주식·원자재·FX 포함) 순회 관측
                            # 양수면 거래량 상위 그 개수만 (예전 방식)
# 전체 순회 시 사이클마다 이만큼씩 돌아가며 봄 (레이트리밋 보호, 모드가 자동 설정)

# ── 운용 리듬 ──
loop_interval_min: 30       # 30분마다 인지→판단→실행 사이클
builder_code: mustache      # 주문에 첨부 (미승인 계정은 자동 생략)

# ── 보고 ──
report_every_cycles: 8      # 8사이클(약 4시간)마다 성과 요약
# 텔레그램 알림은 .env의 TELEGRAM_* 설정 시 자동 활성

# ── 브래킷 트레이더 (일일 봉인 상위 3픽 매매) ──
# 모드: base = 55일 실측으로 검증된 기본 계획 (거래 승률 약 80%, 수익 나는 날 약 60%)
#       hard = 익절 3% 고정·큰 변동 노림 (거래 승률 약 56%, 총수익은 더 큼)
# 모드마다 기록 파일이 따로다 (base=bracket_state.json, hard=bracket_state_hard.json).
# 한 계좌를 둘이 나눠 쓸 수 없어, 한쪽이 돌고 있으면 다른 쪽은 시작을 거부한다.
bracket_mode: base
bracket_capital_pct: 30     # 가용 증거금 중 이만큼만 사용 (100 = 전부)
                            # 30%로 시작한다. 계좌 단위 일일 한도가 없는
                            # 구조라, 첫 주에 전액을 걸지 않는 쪽이 맞다.
                            # 익숙해지면 올려라.
bracket_slots: 8            # 봉인의 trade_rank 상위 픽 수 (일반 6 + 특별 2)
bracket_leverage: 5         # 종목 상한이 더 낮으면 그 값
bracket_deploy_pct: 0.97    # 가용 증거금의 97% 투입 (3%는 수수료·펀딩 버퍼)
bracket_tp_mult: 1.5        # 익절 = 예상변동폭 x 1.5
bracket_sl_mult: 1.0        # 손절 = 예상변동폭 x 1.0
# Take-profit executes as a LIMIT at the same price when triggered (maker
# fee 0.015% vs taker 0.04%, no slippage past the line). Off by default: a
# wick that touches the trigger without trading through can leave the limit
# unfilled, and the position then runs to the stop or the 24h expiry. The
# stop-loss always executes as market: getting filled is its whole job.
bracket_tp_limit: false
# Entry as a resting limit at the anchor price (maker). An unfilled entry is
# cancelled after bracket_entry_wait_sec and the seat is skipped that cycle:
# missing a runner is accepted, the pick was priced at the anchor.
bracket_entry_limit: false
bracket_entry_wait_sec: 120
# Stop-loss as trigger-limit: trigger at the stop, limit this many expected-
# moves worse. 0 keeps the stop a pure market trigger (always fills). A small
# buffer (e.g. 0.5) caps slippage while making the fill near-certain; know
# that a gap through the buffer leaves the position running to liquidation
# protection, which is why market is the shipped default.
bracket_sl_limit_buffer: 0
bracket_vol_floor_pct: 0.8  # 예상변동 0.8% 미만 픽 제외
# 호가가 얇아 왕복 비용이 익절폭을 갉아먹는 종목은 봉인에서 빼둔다.
# 시장의 성질이라 계좌와 무관하게 같다 (2026-08-19 실측):
#   CHIP  1틱이 0.392%, 어떤 손절도 그 안으로는 못 지킨다
#   BP    봉인 슬리피지 0.421%
#   KAITO 예상변동 6%대라 손절폭이 -6% 넘게 벌어진다
# 지우면 다시 거래한다. 다른 종목을 막고 싶으면 같은 줄에 추가하면 된다.
bracket_skip_syms: ["KAITO", "CHIP", "BP"]
bracket_horizon_h: 24       # 만기: 다음 봉인 전 시장가 청산

# ── 하드 모드 기본값 (⚠️ 아직 전방 검증 안 됨) ──
# 위 bracket_mode 를 hard 로 바꾸고 아래 주석을 풀어야 적용된다.
# 근거는 55일 재생 실측뿐이고, 실시간(전방) 검증은 아직 통과하지 않았다.
# 베이스와 성적이 다르니 반드시 소액으로 먼저 확인할 것.
# bracket_tp_pct: 3.0        # 익절 3% 고정 (예상변동폭 배수가 아님)
# bracket_sl_mult: 1.0       # 손절은 그대로 예상변동폭 x 1.0 (실측 관행)
# bracket_vol_floor_pct: 1.5 # 3% 익절은 잔잔한 픽에선 하루 안에 안 닿는다
# bracket_horizon_h: 24      # 만기는 베이스와 동일
# bracket_leverage: 3        # 검증 전까지 축소 유지
